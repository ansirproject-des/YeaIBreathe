services:
  db: 
    image: postgres:16-alpine
    container_name: breathing-app-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      PORTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: breathing_app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: